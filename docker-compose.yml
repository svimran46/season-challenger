# Local services for development: `docker compose up -d`
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: season
      POSTGRES_PASSWORD: season
      POSTGRES_DB: season_challenger
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
volumes:
  pgdata:
